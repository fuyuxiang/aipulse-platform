name: AIPulse Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: aipulse-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate release
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Package and publish release
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate release version
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH or a prerelease suffix."
            exit 1
          fi
      - name: Download validated frontend build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: aipulse-frontend
          path: ${{ runner.temp }}/aipulse-frontend
      - name: Package source, frontend and checksums
        run: |
          mkdir -p "${RUNNER_TEMP}/aipulse-release"
          git archive --format=tar.gz --prefix="aipulse-platform-${RELEASE_TAG}/" \
            -o "${RUNNER_TEMP}/aipulse-release/aipulse-platform-${RELEASE_TAG}-source.tar.gz" HEAD
          tar -czf "${RUNNER_TEMP}/aipulse-release/aipulse-platform-${RELEASE_TAG}-frontend.tar.gz" \
            -C "${RUNNER_TEMP}/aipulse-frontend" .
          cd "${RUNNER_TEMP}/aipulse-release"
          sha256sum ./*.tar.gz > SHA256SUMS
      - name: Publish GitHub release
        run: |
          args=(--verify-tag --generate-notes --title "AIPulse ${RELEASE_TAG}")
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${args[@]}" \
            "${RUNNER_TEMP}/aipulse-release/"*
